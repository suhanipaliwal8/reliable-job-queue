services:
  mysql:
    image: mysql:8.0
    container_name: jobqueue-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: jobqueue
      MYSQL_USER: jobqueue
      MYSQL_PASSWORD: jobqueue_pw
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  - mysql_data:/var/lib/mysql
  - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro