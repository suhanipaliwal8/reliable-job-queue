name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: jobqueue_test
          MYSQL_USER: jobqueue
          MYSQL_PASSWORD: jobqueue_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      JQ_DB_HOST: 127.0.0.1
      JQ_DB_PORT: 3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev,api]"

      - name: Run tests
        run: pytest -v